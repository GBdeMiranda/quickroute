name: Release Extension Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from manifest
        id: get_version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected version $VERSION"

      - name: Package extension into zip
        run: |
          zip -r "quickroute-v${VERSION}.zip" manifest.json icons/ src/ LICENSE privacy_policy.md
          cp "quickroute-v${VERSION}.zip" quickroute.zip

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && ! "$TAG" =~ ^v ]]; then
            TAG="v${VERSION}"
          fi
          gh release create "$TAG" "quickroute-v${VERSION}.zip" "quickroute.zip" \
            --title "QuickRoute v${VERSION}" \
            --generate-notes \
            || gh release upload "$TAG" "quickroute-v${VERSION}.zip" "quickroute.zip" --clobber
